<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div class="">
        <section class="section-cadastro" id="sectionCadastro">
            <form id="cadastro">
                <label for="cadastro-nome">Nome</label>
                <input type="text" id="cadastro-nome" name="nome">
                
                <label for="cadastro-email">Email</label>
                <input type="email" id="cadastro-email" name="email">

                <label for="cadastro-tefone">Telefone</label>
                <input type="tel" id="cadastro-tefone" name="telefone">

                <label for="cadastro-cpf">Cpf</label>
                <input type="text" id="cadastro-cpf" name="cpf">

                <label for="cadastro-senha">Senha</label>
                <input type="text" id="cadastro-senha" name="senha">
            </form>
        </section>
    </div>
    <script src="./js/"></script>
</body>
</html>
